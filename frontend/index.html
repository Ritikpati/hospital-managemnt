<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hospital Management</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b5d6b'/%3E%3Cpath d='M4 17h6l3-8 5 15 3-7h7' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Telugu:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#10222f;--muted:#5b6e79;--line:#dde6ea;--bg:#f1f5f7;--surface:#fff;--brand:#0b5d6b;--brand-d:#08434d;--brand-l:#d8eff2;
--amber:#8a5700;--amber-l:#fff1d6;--green:#1b6b45;--green-l:#ddf3e7;--red:#b3372e;--red-l:#fbe4e1;--r:14px}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;font:15px/1.5 "Figtree","Noto Sans Devanagari","Noto Sans Telugu",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid #7cc4cf;outline-offset:2px}
[hidden]{display:none!important}
.grow{flex:1}

/* buttons + fields */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--brand);background:var(--brand);color:#fff;font-weight:600;padding:9px 16px;border-radius:10px;cursor:pointer;transition:background .15s}
.btn:hover{background:var(--brand-d)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:#fff;color:var(--brand-d);border-color:var(--line)}
.btn.ghost:hover{background:#f3f8f9}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:8px}
.btn.block{width:100%;padding:12px 16px}
.icon{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:10px;border:0;background:transparent;cursor:pointer;color:var(--muted)}
.icon:hover{background:#eef3f5}
.fld{display:grid;gap:5px;font-size:13.5px;font-weight:600;color:#33454f}
.fld>span small{font-weight:400;color:var(--muted)}
.fld input,.fld select,.fld textarea,.lang{width:100%;padding:10px 12px;border:1px solid #c5d3d9;border-radius:10px;background:#fff;font-weight:400;font-size:15px}
.fld input:focus,.fld select:focus,.fld textarea:focus,.lang:focus{border-color:var(--brand);outline:3px solid #cfe9ed;outline-offset:0}
.fld textarea{resize:vertical;min-height:84px}
.lang{width:auto;padding:7px 10px;font-size:14px}
.pw{position:relative}
.pw input{padding-right:44px}
.pw .eye{position:absolute;right:4px;top:3px}
.meter{display:flex;gap:4px;margin-top:2px}
.meter i{flex:1;height:4px;border-radius:2px;background:#e1e9ec}
.meter.s1 i:nth-child(1){background:#d9534f}
.meter.s2 i:nth-child(-n+2){background:#e0a100}
.meter.s3 i{background:#2e9a62}
.hint{font-size:12.5px;color:var(--muted);font-weight:400}
.ferr{min-height:20px;color:var(--red);font-size:14px;font-weight:500}

/* auth */
.auth{display:grid;grid-template-columns:minmax(340px,1fr) minmax(380px,1fr);min-height:100vh}
.auth-side{background:#0a3a46;color:#e6f4f6;padding:44px 52px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth-side h1{font-size:34px;line-height:1.15;font-weight:700;max-width:14em;margin-bottom:12px}
.auth-side p{color:#a9cdd4;max-width:30em}
.auth-side .ecg{position:absolute;left:-20px;right:-20px;top:36%;width:calc(100% + 40px);opacity:.5}
.ecg polyline{fill:none;stroke:#3aa7b8;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.brandrow{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;position:relative}
.logo{width:34px;height:34px;border-radius:9px;background:var(--brand);display:grid;place-items:center;color:#fff;flex:none}
.auth-side .logo{background:#12707f}
.auth-main{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;position:relative}
.auth-top{position:absolute;top:18px;right:20px}
.auth-card{width:100%;max-width:410px}
.auth-card .mob{display:none;margin-bottom:22px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#e6edf0;border-radius:11px;padding:4px;margin-bottom:26px}
.tabs button{border:0;background:transparent;padding:9px;border-radius:8px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px #0002}
.auth-card h2{font-size:26px;font-weight:700;margin-bottom:4px}
.auth-card .sub{color:var(--muted);margin-bottom:22px}
.auth-card form{display:grid;gap:15px}
.auth-card .alt{text-align:center;margin-top:18px;color:var(--muted);font-size:14px}
.auth-card .alt button{border:0;background:none;color:var(--brand);font-weight:600;cursor:pointer;padding:0}
.note{margin-top:20px;padding:12px 14px;border-radius:10px;background:#fff;border:1px solid var(--line);font-size:13px;color:var(--muted)}

/* shell */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:#fff;border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px}
.side .brandrow{padding:0 8px}
.nav{display:grid;gap:3px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a:hover{background:#f3f7f8;color:var(--ink)}
.nav a.on{background:var(--brand-l);color:var(--brand-d);font-weight:600}
.side-foot{margin-top:auto;padding:12px;border-radius:12px;background:#f4f8f9;display:flex;gap:10px;align-items:center;min-width:0}
.side-foot div{min-width:0;line-height:1.3}
.side-foot b,.side-foot small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-foot small{color:var(--muted)}
.av{width:36px;height:36px;border-radius:50%;background:var(--brand-l);color:var(--brand-d);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.top{display:flex;align-items:center;gap:12px;padding:14px 32px;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top h2{font-size:18px;font-weight:700}
.content{padding:26px 32px 40px;max-width:1200px}
.page-h{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.page-h h1{font-size:26px;font-weight:700}
.page-h p{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:20px;overflow:hidden}
.panel-h{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.panel-h h3{font-size:16px;font-weight:700}
.panel-b{padding:20px}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:start}
.cols.even{grid-template-columns:1fr 1fr}
.cols .panel{margin-bottom:0}

.stats{display:grid;grid-template-columns:repeat(4,1fr)}
.stat{padding:18px 22px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block;font-size:30px;font-weight:700;line-height:1.1}
.stat span{color:var(--muted);font-size:13.5px}

.scroll{overflow:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:13px;font-weight:600;color:var(--muted);padding:10px 16px;border-bottom:1px solid var(--line);background:#f8fafb;white-space:nowrap}
.tbl td{padding:12px 16px;border-bottom:1px solid #eef2f4;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover{background:#f6fafb}
.who{display:flex;align-items:center;gap:11px;min-width:0}
.who b{display:block;line-height:1.25}
.who small{color:var(--muted)}
.pill{display:inline-flex;align-items:center;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.waiting{background:var(--amber-l);color:var(--amber)}
.pill.in-progress{background:var(--brand-l);color:var(--brand-d)}
.pill.done{background:var(--green-l);color:var(--green)}
.pill.dx{background:#eef1f8;color:#40508a;margin:1px 3px 1px 0}
.pill.role{background:#eef1f8;color:#40508a}
.pill.admin{background:#f3e8fb;color:#6a2f93}
.empty{padding:38px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.empty .btn{margin-top:14px}
.search{position:relative;flex:1;min-width:200px;max-width:380px}
.search input{width:100%;padding:9px 12px 9px 38px;border:1px solid #c5d3d9;border-radius:10px;background:#fff}
.search svg{position:absolute;left:12px;top:11px;color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* queue tickets */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
.col{background:#e7eef1;border-radius:var(--r);padding:12px}
.col h3{font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;padding:4px 6px 12px}
.col h3 em{font-style:normal;font-weight:600;background:#fff;border-radius:99px;padding:0 9px;color:var(--muted)}
.ticket{background:#fff;border-radius:12px;display:grid;grid-template-columns:66px 1fr;margin-bottom:10px;border:1px solid var(--line)}
.ticket .no{display:grid;place-items:center;font-size:27px;font-weight:700;color:var(--brand-d);border-right:2px dashed #c3d2d9;position:relative}
.ticket .no::before,.ticket .no::after{content:"";position:absolute;right:-9px;width:16px;height:16px;border-radius:50%;background:#e7eef1}
.ticket .no::before{top:-9px}
.ticket .no::after{bottom:-9px}
.ticket .info{padding:10px 12px;display:grid;gap:8px;min-width:0}
.ticket .info b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ticket .btns{display:flex;gap:6px;flex-wrap:wrap}
.mini{display:grid}
.mini .row{display:flex;align-items:center;gap:12px;padding:11px 20px;border-bottom:1px solid #eef2f4}
.mini .row:last-child{border-bottom:0}
.mini .n{font-weight:700;color:var(--brand-d);width:34px}

/* patient detail */
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 20px}
.kv div small{display:block;color:var(--muted);font-size:12.5px}
.kv div span{font-weight:500;word-break:break-word}
.kv .full{grid-column:1/-1}
.weeks{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:18px}
.wk{border:1px dashed #b9c9d0;border-radius:12px;padding:10px;text-align:left;background:#fff;cursor:pointer;display:grid;gap:2px}
.wk b{font-size:13px}
.wk small{color:var(--muted);font-size:12px}
.wk.done{border-style:solid;border-color:#bfe3cf;background:var(--green-l)}
.wk.done small{color:var(--green)}
.wk.sel{outline:3px solid #9fd0d8;outline-offset:1px}
.wkview{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fafcfc}
.wkview form{display:grid;gap:14px}
.photo-link{display:inline-flex;gap:6px;align-items:center;color:var(--brand);font-weight:600;text-decoration:none}

/* form grids + chips */
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fg .full{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipc{position:relative}
.chipc input{position:absolute;opacity:0;inset:0;cursor:pointer}
.chipc span{display:inline-block;padding:7px 14px;border-radius:99px;border:1px solid #c5d3d9;background:#fff;font-weight:500;font-size:14px}
.chipc input:checked+span{background:var(--brand);border-color:var(--brand);color:#fff}
.chipc input:focus-visible+span{outline:3px solid #7cc4cf;outline-offset:2px}
.seg{display:grid;grid-auto-flow:column;gap:6px}

/* drawer + toasts */
.scrim{position:fixed;inset:0;background:#0a1f2988;z-index:30;animation:fade .15s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:#fff;z-index:31;display:flex;flex-direction:column;box-shadow:-12px 0 40px #0003;animation:slide .2s ease-out}
.drawer>header{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer>header h2{flex:1;font-size:19px}
.drawer-b{padding:20px;overflow:auto}
.drawer-f{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
@keyframes slide{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toasts{position:fixed;right:20px;bottom:20px;z-index:60;display:grid;gap:8px;max-width:calc(100% - 40px)}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 8px 24px #0004;animation:slide .2s}
.toast.err{background:var(--red)}
.toast a{color:#9fe0ea;font-weight:600}
.loading{padding:60px;text-align:center;color:var(--muted)}

@media(max-width:1000px){.cols,.cols.even{grid-template-columns:1fr}.board{grid-template-columns:1fr}}
@media(max-width:860px){
 .auth{grid-template-columns:1fr}.auth-side{display:none}.auth-card .mob{display:flex}
 .shell{grid-template-columns:1fr}
 .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;padding:6px 8px;gap:0;z-index:20;border-right:0;border-top:1px solid var(--line)}
 .side .brandrow,.side-foot{display:none}
 .nav{display:flex;width:100%;justify-content:space-around}
 .nav a{flex-direction:column;gap:2px;font-size:11px;padding:6px 8px;text-align:center}
 .content{padding:18px 14px 96px}.top{padding:12px 14px}.toasts{bottom:84px;right:14px}
 .stats{grid-template-columns:1fr 1fr}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--line)}
 .fg,.kv{grid-template-columns:1fr}
 .weeks{grid-template-columns:repeat(5,minmax(78px,1fr));overflow:auto}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const store={get:k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const S={tok:store.get('tok'),role:store.get('role'),name:store.get('name'),lang:store.get('lang')||'en',mode:'login',
 pts:[],queue:[],pays:[],users:[],wrep:[],detail:null,wk:0,q:''};

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const t=(k,v)=>{let s=(T[S.lang]&&T[S.lang][k])||T.en[k]||k;if(v)for(const x in v)s=s.replace('{'+x+'}',v[x]);return s};
const loc=()=>S.lang==='hi'?'hi-IN':S.lang==='te'?'te-IN':'en-IN';
const fmtD=i=>i?new Date(i).toLocaleDateString(loc(),{day:'numeric',month:'short',year:'numeric'}):'-';
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const ini=p=>((p.first_name||'?')[0]+((p.last_name||'')[0]||'')).toUpperCase();
const pname=p=>`${p.first_name} ${p.last_name}`.trim();
const me=()=>{try{return JSON.parse(atob(S.tok.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).sub||''}catch(e){return ''}};
const sameDay=i=>new Date(i).toDateString()===new Date().toDateString();
const STATUS={'waiting':'waiting','in-progress':'in_progress','done':'done'};
const pill=s=>`<span class="pill ${esc(s)}">${esc(t(STATUS[s]||s))}</span>`;

function toast(msg,type,html){
 const el=document.createElement('div');el.className='toast'+(type==='err'?' err':'');
 if(html)el.innerHTML=msg;else el.textContent=msg;
 $('#toasts').appendChild(el);setTimeout(()=>el.remove(),type==='err'?6000:4500)}

async function api(path,o={}){
 const h={...(o.headers||{})};if(S.tok)h.Authorization='Bearer '+S.tok;
 let body=o.body,method=o.method;
 if(o.json!==undefined){h['Content-Type']='application/json';body=JSON.stringify(o.json);method=method||'POST'}
 const r=await fetch(path,{method,body,headers:h});
 const d=await r.json().catch(()=>({}));
 if(!r.ok){
  if(r.status===401&&S.tok&&!o.noLogout)signOut();
  let m=d.detail;if(Array.isArray(m))m=m.map(x=>((x.loc||[]).slice(-1)[0]||'')+': '+x.msg).join(', ');
  throw new Error(typeof m==='string'&&m?m:(r.statusText||'Something went wrong'))}
 return d}

function saveSession(r){S.tok=r.token;S.role=r.role;S.name=r.name;store.set('tok',r.token);store.set('role',r.role);store.set('name',r.name)}
function signOut(){['tok','role','name'].forEach(store.del);S.tok=S.role=S.name='';S.detail=null;closeDrawer();history.replaceState(null,'','#/');render()}
const route=()=>{const h=location.hash.replace(/^#\/?/,'').split('/');return{page:h[0]||'dashboard',id:h[1]}};
const go=h=>{location.hash=h};

async function busy(btn,label,fn){
 const old=btn?btn.innerHTML:'';if(btn){btn.disabled=true;btn.textContent=label}
 try{return await fn()}finally{if(btn){btn.disabled=false;btn.innerHTML=old}}}

async function doLogin(email,password){
 const r=await api('/auth/login',{json:{email:email.trim(),password},noLogout:true});
 saveSession(r);history.replaceState(null,'','#/dashboard');await render()}

const strength=p=>{let s=0;if(p.length>=8)s++;if(/[A-Z]/.test(p)&&/[a-z]/.test(p))s++;if(/\d/.test(p)&&/[^A-Za-z0-9]|.{12,}/.test(p))s++;return p?Math.max(1,s):0};

/* ---------- shell ---------- */
function shell(page,inner){
 const admin=S.role==='admin';
 const items=[['dashboard','grid'],['patients','users'],['queue','clock'],['payments','card']];
 if(admin)items.push(['reports','file'],['users','shield']);
 const title=t(page==='patient'?'patients':page);
 return `<div class="shell">
 <aside class="side">
  <div class="brandrow">${logo()}<span>${t('app')}</span></div>
  <nav class="nav">${items.map(([k,i])=>`<a href="#/${k}" class="${k===page?'on':''}">${ic(i,19)}<span>${t(k)}</span></a>`).join('')}</nav>
  <div class="side-foot"><span class="av">${esc((S.name||'?').slice(0,2).toUpperCase())}</span><div><b>${esc(S.name)}</b><small>${esc(admin?'Administrator':'Staff')}</small></div></div>
 </aside>
 <div class="main">
  <header class="top"><h2>${title}</h2><span class="grow"></span>${langSel()}<button class="btn ghost sm" data-act="logout">${ic('out',16)}<span>${t('logout')}</span></button></header>
  <div class="content" id="content">${inner}</div>
 </div></div>`}

/* ---------- rendering ---------- */
let renderId=0;
async function render(){
 document.documentElement.lang=S.lang;
 const root=$('#root');
 if(!S.tok){root.innerHTML=authHTML();return}
 let {page,id}=route();
 if(['reports','users'].includes(page)&&S.role!=='admin'){go('#/dashboard');return}
 if(!['dashboard','patients','queue','payments','reports','users'].includes(page))page='dashboard';
 const navPage=page;
 const rid=++renderId;
 root.innerHTML=shell(navPage==='patients'&&id?'patient':navPage,`<div class="loading">…</div>`);
 try{
  let html='';
  if(page==='dashboard'){[S.pts,S.queue,S.pays]=await Promise.all([api('/patients'),api('/queue'),api('/payments')]);html=pDashboard()}
  else if(page==='patients'&&id){const [d,pts]=await Promise.all([api('/patients/'+encodeURIComponent(id)),api('/patients')]);S.detail=d;S.pts=pts;S.wk=nextWeek(d);html=pDetail()}
  else if(page==='patients'){S.pts=await api('/patients');html=pPatients()}
  else if(page==='queue'){[S.pts,S.queue]=await Promise.all([api('/patients'),api('/queue')]);html=pQueue()}
  else if(page==='payments'){[S.pts,S.pays]=await Promise.all([api('/patients'),api('/payments')]);html=pPayments()}
  else if(page==='reports'){[S.pts,S.wrep]=await Promise.all([api('/patients'),api('/patients/weekly-report')]);html=pReports()}
  else if(page==='users'){S.users=await api('/auth/users');html=pUsers()}
  if(rid!==renderId)return;
  $('#content').innerHTML=html;
 }catch(e){
  if(rid!==renderId||!S.tok)return;
  $('#content').innerHTML=`<div class="panel"><div class="empty"><b>Could not load this page</b>${esc(e.message)}<br><button class="btn" data-act="retry">Try again</button></div></div>`}
}

  <div class="panel"><div class="panel-h"><h3>${t('weekly')}</h3></div><div class="panel-b" id="wkbox">${weeksHTML()}</div></div>
  <div class="panel"><div class="panel-h"><h3>${t('patient')}</h3></div><div class="panel-b"><div class="kv">
   ${k(t('mobile'),d.mobile)}${k(t('email'),d.email)}${k(t('age')+' / '+t('gender'),(d.age??'')+(d.gender?', '+d.gender:''))}${k(t('blood_group'),d.blood_group)}
   ${k(t('address'),[d.address,d.city,d.state].filter(Boolean).join(', '),1)}${k(t('occupation'),d.occupation)}${k(t('heard_about_us'),d.heard_about_us)}${k(t('referred_by'),d.referred_by)}
   <div class="full"><small>${t('diseases')}</small><span>${(d.diseases||[]).map(x=>`<span class="pill dx">${esc(x)}</span>`).join('')||'-'}</span></div></div></div></div>
 </div>`}
function weeksHTML(){
 const d=S.detail,by={};(d.weeks||[]).forEach(w=>by[w.week]=w);
 const tiles=[1,2,3,4,5].map(n=>`<button type="button" class="wk ${by[n]?'done':''} ${S.wk===n?'sel':''}" data-act="pickWeek" data-w="${n}"><b>${t('week')} ${n}</b><small>${by[n]?t('recorded'):t('not_rec')}</small></button>`).join('');
 let body;
 if(!S.wk)body=`<p class="hint">${t('pick_week')}</p>`;
 else if(by[S.wk]){const w=by[S.wk];
  body=`<h3 style="margin-bottom:8px">${t('week')} ${S.wk}</h3><p style="white-space:pre-wrap">${esc(w.symptoms)||'-'}</p>${w.photo_url?`<p style="margin-top:12px"><a class="photo-link" target="_blank" rel="noopener" href="${esc(w.photo_url)}">${ic('cam',17)}${t('view_photo')}</a></p>`:''}<p class="hint" style="margin-top:12px">${t('locked')}</p>`}
 else body=`<form data-form="week"><h3>${t('week')} ${S.wk}</h3><input type="hidden" name="week" value="${S.wk}">
  <label class="fld"><span>${t('symptoms')}</span><textarea name="symptoms" placeholder="…"></textarea></label>
  <label class="fld"><span>${t('photo')} <small>(optional)</small></span><input type="file" name="photo" accept="image/*" capture="environment"></label>
  <p class="hint">${t('locked')}</p><p class="ferr" id="ferr" role="alert"></p>
  <div><button class="btn" type="submit">${t('save_week')}</button></div></form>`;
 return `<div class="weeks">${tiles}</div><div class="wkview">${body}</div>`}

/* ----- queue ----- */
function ticket(x){
 const b=(s,l,c)=>`<button class="btn sm ${c||''}" data-act="status" data-id="${x.id}" data-s="${s}">${l}</button>`;
 const btns=x.status==='waiting'?b('in-progress',t('start')):x.status==='in-progress'?b('done',t('finish'))+b('waiting',t('waiting'),'ghost'):b('in-progress',t('reopen'),'ghost');
 return `<div class="ticket"><div class="no">${x.token_no}</div><div class="info"><b>${esc(x.first_name+' '+x.last_name)}</b><div class="btns">${btns}</div></div></div>`}
function boardHTML(){
 return ['waiting','in-progress','done'].map(s=>{const l=S.queue.filter(x=>x.status===s);
  return `<div class="col"><h3>${t(STATUS[s])}<em>${l.length}</em></h3>${l.map(ticket).join('')||`<p class="hint" style="padding:6px">-</p>`}</div>`}).join('')}
function pQueue(){
 return `<div class="page-h"><div><h1>${t('todays_queue')}</h1></div><span class="grow"></span><button class="btn" data-act="newQueue">${ic('plus',17)}${t('add_queue')}</button></div>
 ${S.queue.length?'':`<div class="panel" id="qempty"><div class="empty"><b>${t('empty_q')}</b>${t('empty_q_s')}</div></div>`}
 <div class="board" id="board">${boardHTML()}</div>`}
function queueForm(){
 return `<form data-form="queue"><label class="fld"><span>${t('patient')}</span><select name="pid" required><option value="">${t('pick_patient')}</option>${S.pts.map(p=>`<option value="${p.id}">${esc(pname(p))} (#${p.id})</option>`).join('')}</select></label>
 <p class="ferr" id="ferr" role="alert"></p><div class="drawer-f"><button type="button" class="btn ghost" data-act="closeDrawer">${t('cancel')}</button><button class="btn" type="submit">${t('generate_token')}</button></div></form>`}
async function refreshQueue(){
 try{S.queue=await api('/queue')}catch(e){return}
 const b=$('#board');if(b)b.innerHTML=boardHTML();
 const e=$('#qempty');if(e&&S.queue.length)e.remove();
 const dq=$('#dq');if(dq)dq.innerHTML=S.queue.length?S.queue.slice(0,7).map(ticketRow).join(''):`<div class="empty"><b>${t('empty_q')}</b>${t('empty_q_s')}</div>`}

/* ----- payments ----- */
function payForm(pid){
 return `<form data-form="pay"><div class="fg">
  <label class="fld full"><span>${t('patient')}</span><select name="pid" required><option value="">${t('pick_patient')}</option>${S.pts.map(p=>`<option value="${p.id}" ${String(p.id)===String(pid)?'selected':''}>${esc(pname(p))} (#${p.id})</option>`).join('')}</select></label>
  ${field('amount','number',t('amount')+' (₹)','required min="1" step="0.01" inputmode="decimal"')}
  <label class="fld"><span>${t('method')}</span><select name="method"><option value="cash">${t('cash')}</option><option value="card">${t('card_m')}</option><option value="upi">${t('upi')}</option></select></label>
 </div><p class="ferr" id="ferr" role="alert"></p>
 <div class="drawer-f"><button class="btn" type="submit">${t('save_payment')}</button></div></form>`}
function payRows(){
 if(!S.pays.length)return `<tr><td colspan="6"><div class="empty"><b>${t('empty_pay')}</b></div></td></tr>`;
 return S.pays.map(x=>`<tr><td>#${x.id}</td><td>${esc(x.patient_name)}</td><td><b>${money(x.amount)}</b></td><td>${esc(x.method||'')}</td><td>${fmtD(x.created_at)}</td><td>${esc(x.created_by||'')}</td></tr>`).join('')}
function pPayments(){
 const tot=S.pays.reduce((a,x)=>a+Number(x.amount),0);
 return `<div class="page-h"><div><h1>${t('payments')}</h1><p>${t('total')}: <b>${money(tot)}</b></p></div></div>
 <div class="cols"><div class="panel"><div class="scroll"><table class="tbl"><thead><tr><th>${t('receipt')}</th><th>${t('patient')}</th><th>${t('amount')}</th><th>${t('method')}</th><th>${t('date')}</th><th>${t('received_by')}</th></tr></thead><tbody id="paybody">${payRows()}</tbody></table></div></div>
 <div class="panel"><div class="panel-h"><h3>${t('record_payment')}</h3></div><div class="panel-b">${payForm('')}</div></div></div>`}

/* ----- admin ----- */
function pReports(){
 const by={};S.wrep.forEach(r=>by[r.patient_id+'-'+r.week]=r);
 const cell=(p,n)=>{const r=by[p.id+'-'+n];return r?`<span title="${esc(r.symptoms)}" style="color:var(--green);font-weight:600">✓</span>${r.photo_url?` <a class="photo-link" target="_blank" rel="noopener" href="${esc(r.photo_url)}" aria-label="${t('view_photo')}">${ic('cam',15)}</a>`:''}`:'<span style="color:#9aa9b1">-</span>'};
 return `<div class="page-h"><div><h1>${t('reports')}</h1></div></div><div class="panel"><div class="scroll"><table class="tbl"><thead><tr><th>${t('patient')}</th>${[1,2,3,4,5].map(n=>`<th>${t('week')} ${n}</th>`).join('')}</tr></thead><tbody>
 ${S.pts.length?S.pts.map(p=>`<tr class="click" data-act="open" data-id="${p.id}"><td><div class="who"><span class="av">${esc(ini(p))}</span><b>${esc(pname(p))}</b></div></td>${[1,2,3,4,5].map(n=>`<td>${cell(p,n)}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="6"><div class="empty"><b>${t('empty_pts')}</b></div></td></tr>`}</tbody></table></div></div>`}
function userRows(){return S.users.map(u=>`<tr><td><div class="who"><span class="av">${esc((u.name||'?').slice(0,2).toUpperCase())}</span><b>${esc(u.name)}</b></div></td><td>${esc(u.email)}</td><td><span class="pill role ${u.role==='admin'?'admin':''}">${esc(u.role)}</span></td><td>${fmtD(u.created_at)}</td></tr>`).join('')}
function pUsers(){
 return `<div class="page-h"><div><h1>${t('users')}</h1></div></div><div class="cols"><div class="panel"><div class="scroll"><table class="tbl"><thead><tr><th>${t('name')}</th><th>${t('email')}</th><th>${t('role')}</th><th>${t('joined')}</th></tr></thead><tbody id="ubody">${userRows()}</tbody></table></div></div>
 <div class="panel"><div class="panel-h"><h3>${t('add_user')}</h3></div><div class="panel-b"><form data-form="user" style="display:grid;gap:14px">
  ${field('name','text',t('name'),'required')}${field('email','email',t('email'),'required')}${pwField('password',t('password'),'new-password',t('pw_hint'))}
  <label class="fld"><span>${t('role')}</span><select name="role"><option value="employee">employee</option><option value="admin">admin</option></select></label>
  <p class="ferr" id="ferr" role="alert"></p><div><button class="btn" type="submit">${t('add_user')}</button></div></form></div></div></div>`}

/* ---------- drawer ---------- */
function openDrawer(title,body){
 $('#overlay').innerHTML=`<div class="scrim" data-act="closeDrawer"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><h2>${esc(title)}</h2><button class="icon" data-act="closeDrawer" aria-label="Close">${ic('x')}</button></header><div class="drawer-b">${body}</div></aside>`;
 const f=$('#overlay input:not([type=hidden]),#overlay select');if(f)f.focus()}
function closeDrawer(){$('#overlay').innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});

/* ---------- photo shrink (phone photos are huge) ---------- */
function shrink(file){
 return new Promise(res=>{
  if(!file||!file.type.startsWith('image/')||file.size<600000)return res(file);
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const m=1600,k=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');
   c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
   c.toBlob(b=>res(b||file),'image/jpeg',.85)};
  img.onerror=()=>{URL.revokeObjectURL(u);res(file)};img.src=u})}

/* ---------- events ---------- */
const ferr=m=>{const e=$('#ferr');if(e)e.textContent=m||''};
const ACT={
 mode:b=>{S.mode=b.dataset.m;render()},
 eye:b=>{const i=b.parentElement.querySelector('input');i.type=i.type==='password'?'text':'password'},
 logout:()=>signOut(),
 retry:()=>render(),
 closeDrawer:()=>closeDrawer(),
 open:b=>go('#/patients/'+b.dataset.id),
 newPatient:()=>openDrawer(t('new_patient'),patientForm()),
 newQueue:()=>openDrawer(t('add_queue'),queueForm()),
 payFor:b=>openDrawer(t('record_payment'),payForm(b.dataset.id)),
 pickWeek:b=>{S.wk=+b.dataset.w;$('#wkbox').innerHTML=weeksHTML()},
 token:async b=>{try{const r=await api('/patients/'+b.dataset.id+'/token',{method:'POST'});toast(t('token_made',{n:r.token_no,p:pname(S.detail)}))}catch(e){toast(e.message,'err')}},
 status:async b=>{b.disabled=true;try{await api('/queue/'+b.dataset.id,{json:{status:b.dataset.s},method:'PATCH'});await refreshQueue()}catch(e){toast(e.message,'err');b.disabled=false}}
};
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b)return;
 if(b.dataset.act==='closeDrawer'&&e.target.closest('.drawer')&&!e.target.closest('button[data-act="closeDrawer"]'))return;
 const f=ACT[b.dataset.act];if(f){if(b.tagName==='A')e.preventDefault();f(b,e)}});
document.addEventListener('change',e=>{
 if(e.target.dataset.change==='lang'){S.lang=e.target.value;store.set('lang',S.lang);render()}});
document.addEventListener('input',e=>{
 if(e.target.id==='psearch'){S.q=e.target.value;$('#ptbody').innerHTML=ptRows(filtered())}
 const f=e.target.closest('form');
 if(f&&f.dataset.form==='signup'&&e.target.name==='password'){const m=$('#meter');if(m)m.className='meter s'+strength(e.target.value)}});

const FORMS={
 async login(f,btn){
  const d=Object.fromEntries(new FormData(f));
  if(!d.email.trim()||!d.password)return ferr('Enter your email and password.');
  await busy(btn,t('signing'),()=>doLogin(d.email,d.password))},
 async signup(f,btn){
  const d=Object.fromEntries(new FormData(f)),email=d.email.trim().toLowerCase();
  if(!d.name.trim())return ferr('Enter your full name.');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))return ferr('Enter a valid email address.');
  if(d.password.length<8)return ferr(t('pw_hint')+'.');
  if(d.password!==d.confirm)return ferr(t('pw_mismatch'));
  await busy(btn,t('creating'),async()=>{
   await api('/auth/signup',{json:{name:d.name.trim(),email,password:d.password},noLogout:true});
   await doLogin(email,d.password);toast(t('welcome',{n:d.name.trim().split(' ')[0]}))})},
 async patient(f,btn){
  const fd=new FormData(f),d=Object.fromEntries(fd);d.age=+d.age;d.diseases=fd.getAll('diseases');d.email=(d.email||'').trim()||null;
  const r=await busy(btn,'…',()=>api('/patients',{json:d}));
  closeDrawer();toast(t('patient_saved'));go('#/patients/'+r.id)},
 async week(f,btn){
  const fd=new FormData(f),file=fd.get('photo');
  if(file&&file.size){fd.set('photo',await shrink(file),'photo.jpg')}else fd.delete('photo');
  await busy(btn,'…',()=>api('/patients/'+S.detail.id+'/weeks',{method:'POST',body:fd}));
  toast(t('week_saved',{w:fd.get('week')}));render()},
 async queue(f,btn){
  const pid=f.pid.value;if(!pid)return ferr(t('pick_patient'));
  const r=await busy(btn,'…',()=>api('/patients/'+pid+'/token',{method:'POST'}));
  const p=S.pts.find(x=>String(x.id)===pid);closeDrawer();toast(t('token_made',{n:r.token_no,p:p?pname(p):''}));
  if(route().page==='queue'||route().page==='dashboard')render()},
 async pay(f,btn){
  const d=Object.fromEntries(new FormData(f)),p=S.pts.find(x=>String(x.id)===d.pid);
  if(!p)return ferr(t('pick_patient'));
  const r=await busy(btn,'…',()=>api('/payments',{json:{patient_id:p.id,patient_name:pname(p),patient_email:p.email||null,amount:+d.amount,method:d.method}}));
  closeDrawer();toast(`${esc(t('pay_saved'))} <a target="_blank" rel="noopener" href="${esc(r.receipt_url)}">${esc(t('receipt_link',{n:r.id}))}</a>`,'ok',true);
  if(route().page==='payments')render()},
 async user(f,btn){
  const d=Object.fromEntries(new FormData(f));d.email=d.email.trim().toLowerCase();d.name=d.name.trim();
  if(d.password.length<8)return ferr(t('pw_hint')+'.');
  await busy(btn,'…',()=>api('/auth/register',{json:d}));toast(t('user_added'));render()}
};
document.addEventListener('submit',async e=>{
 const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
 const fn=FORMS[f.dataset.form];if(!fn)return;ferr('');
 try{await fn(f,f.querySelector('button[type=submit]'))}catch(x){ferr(x.message);if(!$('#ferr'))toast(x.message,'err')}});

window.addEventListener('hashchange',()=>render());
setInterval(()=>{if(S.tok&&!document.hidden&&['queue','dashboard'].includes(route().page)&&!$('#overlay').innerHTML)refreshQueue()},20000);
render();
</script>
</body>
