apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: ingress-nginx, namespace: argocd}
spec:
  project: default
  source: {repoURL: "https://kubernetes.github.io/ingress-nginx", chart: ingress-nginx, targetRevision: 4.11.3}
  destination: {server: https://kubernetes.default.svc, namespace: ingress-nginx}
  syncPolicy: {automated: {prune: true, selfHeal: true}, syncOptions: [CreateNamespace=true]}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: hospital-management, namespace: argocd}
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_GITHUB_USERNAME/hospital-management.git
    targetRevision: main
    path: k8s
  destination: {server: https://kubernetes.default.svc, namespace: hms}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
    retry: {limit: 10, backoff: {duration: 20s, factor: 2, maxDuration: 5m}}
