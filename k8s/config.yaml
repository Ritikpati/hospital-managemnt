# Replace ACCOUNT_ID (and region if changed). Values = terraform outputs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hms-sa
  namespace: hms
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/hms-app
---
apiVersion: v1
kind: ConfigMap
metadata: {name: hms-config, namespace: hms}
data:
  AWS_REGION: us-east-1
  SNS_TOPIC_ARN: arn:aws:sns:us-east-1:ACCOUNT_ID:hms-notifications
  USER_BUCKET: hms-ACCOUNT_ID-user-data
  RECEIPT_BUCKET: hms-ACCOUNT_ID-payment-receipts
  PHOTO_BUCKET: hms-ACCOUNT_ID-patient-photos
